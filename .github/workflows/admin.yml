name: Deploy admin
on:
  push:
    paths:
      - 'admin/**'
      - 'scripts/build-admin-assets.mjs'
      - 'src/lib/i18n.ts'
      - 'src/lib/site.ts'
      - 'content/site.json'
      - 'package*.json'
      - '.github/workflows/admin.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: blog-admin-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref_name == (vars.BLOG_BRANCH || 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run admin:check
      - run: npm test
      - run: npm run admin:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
